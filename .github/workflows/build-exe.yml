name: Build Windows exe

# Runs on every push and pull request, and can be started by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build exe
        run: npm run dist

      - name: Upload exe as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrackShack-windows
          path: dist/*.exe
          if-no-files-found: error

      # On main, also publish the exes to a "latest" release so there is one stable download link.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crack Shack (latest build)
          body: Built automatically from ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: dist/*.exe
